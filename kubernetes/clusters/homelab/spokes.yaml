apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spokes-registry
  namespace: flux-system
spec:
  dependsOn:
    - name: platform-core
  interval: 10m
  path: ./kubernetes/spokes-registry
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
