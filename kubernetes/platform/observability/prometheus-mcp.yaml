apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-mcp
  namespace: platform-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-mcp
    spec:
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: prometheus-mcp
          image: ghcr.io/pab1it0/prometheus-mcp-server:1.1.0
          command:
            - /app/.venv/bin/python
            - -c
            - |
              import sys
              from prometheus_mcp_server.main import setup_environment
              from prometheus_mcp_server.server import mcp
              if not setup_environment():
                  sys.exit(1)
              mcp.settings.host = "0.0.0.0"
              mcp.settings.port = 8080
              mcp.run(transport="streamable-http")
          env:
            - name: PROMETHEUS_URL
              value: "http://172.28.64.100:9090"
          ports:
            - name: mcp
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 192Mi
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus-mcp
  namespace: platform-observability
spec:
  selector:
    app.kubernetes.io/name: prometheus-mcp
  ports:
    - name: mcp
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-hermes-to-prometheus-mcp
  namespace: platform-observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus-mcp
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: spoke-hermes
      ports:
        - protocol: TCP
          port: 8080
