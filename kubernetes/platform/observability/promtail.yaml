apiVersion: v1
kind: ServiceAccount
metadata:
  name: promtail
  namespace: platform-observability
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: promtail
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/proxy", "services", "endpoints", "pods"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: promtail
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: promtail
subjects:
  - kind: ServiceAccount
    name: promtail
    namespace: platform-observability
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: promtail-config
  namespace: platform-observability
data:
  promtail.yaml: |
    server:
      http_listen_port: 9080
      grpc_listen_port: 0
    positions:
      filename: /run/promtail/positions.yaml
    clients:
      - url: http://172.28.64.100:3100/loki/api/v1/push
    scrape_configs:
      - job_name: ssh-auth
        journal:
          path: /var/log/journal
          max_age: 24h
          matches: _COMM=sshd _COMM=sshd-session
          labels:
            job: ssh-auth
            host: homelab-k3s
        relabel_configs:
          - source_labels: [__journal__systemd_unit]
            regex: 'gate-sshd[.]service'
            target_label: target
            replacement: sftp-gate
        pipeline_stages:
          - regex:
              expression: '^(?P<result>Accepted|Failed) [^ ]+ for (?:invalid user )?(?P<user>[a-z_][a-z0-9._-]{0,31}) from (?P<address>[0-9a-fA-F:.]{2,45}) port [0-9]+'
          - template:
              source: audit
              template: '{{ if .result }}{"result":"{{ .result }}","user":"{{ .user }}","address":"{{ .address }}"}{{ else }}{"result":"sshd_event"}{{ end }}'
          - output:
              source: audit
      - job_name: kubernetes-pods
        kubernetes_sd_configs:
          - role: pod
        pipeline_stages:
          - cri: {}
        relabel_configs:
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_container_name]
            target_label: container
          - source_labels: [__meta_kubernetes_pod_uid, __meta_kubernetes_pod_container_name]
            target_label: __path__
            separator: /
            replacement: /var/log/pods/*$1/*.log
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: promtail
  namespace: platform-observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: promtail
  template:
    metadata:
      labels:
        app.kubernetes.io/name: promtail
    spec:
      serviceAccountName: promtail
      restartPolicy: Always
      containers:
        - name: promtail
          image: grafana/promtail:3.4.2
          args:
            - -config.file=/etc/promtail/promtail.yaml
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /etc/promtail
            - name: varlogpods
              mountPath: /var/log/pods
              readOnly: true
            - name: journal
              mountPath: /var/log/journal
              readOnly: true
            - name: machine-id
              mountPath: /etc/machine-id
              readOnly: true
            - name: run
              mountPath: /run/promtail
      volumes:
        - name: config
          configMap:
            name: promtail-config
        - name: varlogpods
          hostPath:
            path: /var/log/pods
        - name: journal
          hostPath:
            path: /var/log/journal
            type: Directory
        - name: machine-id
          hostPath:
            path: /etc/machine-id
            type: File
        - name: run
          emptyDir: {}
