apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: spoke-kanban
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/reisguilherme/homelab-kanban
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spoke-kanban
  namespace: flux-system
spec:
  # Ativar após: (1) ingresso do M710q e (2) digest @sha256 publicado pelo CI em kubernetes/kanban-mcp.yaml.
  suspend: true
  interval: 5m
  path: ./kubernetes
  prune: true
  sourceRef:
    kind: GitRepository
    name: spoke-kanban
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spoke-kanban-secrets
  namespace: flux-system
spec:
  # Ativar junto com spoke-kanban após criar secrets/kanban-secrets.sops.yaml.
  suspend: true
  interval: 5m
  dependsOn:
    - name: spoke-kanban
  path: ./secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: spoke-kanban
  decryption:
    provider: sops
    secretRef:
      name: sops-age
