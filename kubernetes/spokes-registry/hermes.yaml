apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: spoke-hermes
  namespace: flux-system
spec:
  interval: 5m
  url: https://github.com/reisguilherme/homelab-hermes
  ref:
    branch: main
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spoke-hermes
  namespace: flux-system
spec:
  interval: 5m
  path: ./kubernetes
  prune: true
  sourceRef:
    kind: GitRepository
    name: spoke-hermes
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spoke-hermes-secrets
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: spoke-hermes
  path: ./secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: spoke-hermes
  decryption:
    provider: sops
    secretRef:
      name: sops-age
