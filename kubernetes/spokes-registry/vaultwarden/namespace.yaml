apiVersion: v1
kind: Namespace
metadata:
  name: spoke-vaultwarden
  labels:
    app.kubernetes.io/part-of: spoke-vaultwarden
    homelab.greis.dev.br/spoke: "true"
    pod-security.kubernetes.io/enforce: baseline
  annotations:
    homeship.greis.dev.br/title: Vaultwarden
    homeship.greis.dev.br/icon: lock
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: spoke-vaultwarden-quota
  namespace: spoke-vaultwarden
spec:
  hard:
    requests.memory: 192Mi
    limits.memory: 256Mi
    persistentvolumeclaims: "4"
