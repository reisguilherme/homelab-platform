apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: spoke-dashboard
  namespace: flux-system
spec:
  interval: 5m
  url: ssh://git@github.com/reisguilherme/homelab-dashboard.git
  ref:
    branch: main
  secretRef:
    name: spoke-dashboard-source
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spoke-dashboard
  namespace: flux-system
spec:
  interval: 5m
  path: ./kubernetes
  prune: true
  sourceRef:
    kind: GitRepository
    name: spoke-dashboard
  decryption:
    provider: sops
    secretRef:
      name: sops-age
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: spoke-dashboard-secrets
  namespace: flux-system
spec:
  interval: 5m
  dependsOn:
    - name: spoke-dashboard
  path: ./secrets
  prune: true
  sourceRef:
    kind: GitRepository
    name: spoke-dashboard
  decryption:
    provider: sops
    secretRef:
      name: sops-age
