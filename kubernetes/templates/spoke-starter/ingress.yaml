apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: example-app
  namespace: spoke-example
spec:
  ingressClassName: traefik
  rules:
    - host: example.greis.dev.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: example-app
                port:
                  number: 8080
