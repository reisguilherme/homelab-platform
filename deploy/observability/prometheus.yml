global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: homelab-pve
    scrape_interval: 30s
    scrape_timeout: 5s
    honor_labels: false
    sample_limit: 20000
    body_size_limit: 1MB
    static_configs:
      - targets: [homelab-pve-metrics:9101]
  - job_name: guests
    scrape_interval: 30s
    scrape_timeout: 5s
    honor_labels: false
    sample_limit: 5000
    body_size_limit: 5MB
    file_sd_configs:
      - files: [/etc/prometheus/targets/guests/*.json]
        refresh_interval: 30s
  - job_name: consumers
    metrics_path: /metrics
    honor_labels: false
    sample_limit: 128
    body_size_limit: 1MB
    file_sd_configs:
      - files: [/etc/prometheus/targets/*.json]
        refresh_interval: 30s
