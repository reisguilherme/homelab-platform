groups:
  - name: homelab-tls
    rules:
      - alert: HomelabTLSCertificateExpiring
        expr: (homelab_tls_certificate_not_after_seconds - time() < 21 * 24 * 60 * 60) and (homelab_tls_certificate_not_after_seconds - time() >= 7 * 24 * 60 * 60)
        for: 5m
        labels:
          severity: warning
          owner: homelab
        annotations:
          summary: Certificado TLS exige renovação manual
          description: 'O certificado {{ $labels.certificate }} vence em menos de 21 dias. Renovar por DNS-01, entregar ao proxy, recarregar e atualizar o textfile de expiração. Este alerta não renova certificados.'
      - alert: HomelabTLSCertificateExpiryCritical
        expr: homelab_tls_certificate_not_after_seconds - time() < 7 * 24 * 60 * 60
        for: 5m
        labels:
          severity: critical
          owner: homelab
        annotations:
          summary: Certificado TLS vencido ou próximo do vencimento
          description: 'O certificado {{ $labels.certificate }} vence em menos de 7 dias ou já venceu. Renovar por DNS-01, entregar ao proxy, recarregar e atualizar o textfile de expiração. Este alerta não renova certificados.'
