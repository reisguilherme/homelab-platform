groups:
  - name: homelab-hub-nodes
    rules:
      - alert: HostNodeDown
        expr: up{job="nodes"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Node {{ $labels.instance }} inacessível"
          description: "O node_exporter em {{ $labels.instance }} não responde há mais de 2 minutos."

      - alert: NodeHighMemoryUsage
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memória acima de 90% em {{ $labels.instance }}"
          description: "Uso contínuo de RAM acima de 90% nos últimos 5 minutos."
