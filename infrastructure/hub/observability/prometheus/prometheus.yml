global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: pve
    metrics_path: /pve
    params:
      module: [default]
      cluster: ["1"]
      node: ["1"]
    static_configs:
      - targets: ["192.168.1.20"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: pve-exporter:9221

  - job_name: pve-host
    params:
      collect[]: [hwmon, stat]
    static_configs:
      - targets: ["172.28.64.1:9100"]

  - job_name: nodes
    static_configs:
      - targets:
          - "172.28.64.100:9100"
          - "172.28.64.200:9100"

  - job_name: kube-state-metrics
    static_configs:
      - targets: ["172.28.64.200:30080"]
