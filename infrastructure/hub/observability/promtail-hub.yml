server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: ssh-auth
    journal:
      path: /var/log/journal
      max_age: 24h
      matches: _COMM=sshd _COMM=sshd-session
      labels:
        job: ssh-auth
        host: homelab-hub
    pipeline_stages:
      - regex:
          expression: '^(?P<result>Accepted|Failed) [^ ]+ for (?:invalid user )?(?P<user>[a-z_][a-z0-9._-]{0,31}) from (?P<address>[0-9a-fA-F:.]{2,45}) port [0-9]+'
      - template:
          source: audit
          template: '{{ if .result }}{"result":"{{ .result }}","user":"{{ .user }}","address":"{{ .address }}"}{{ else }}{"result":"sshd_event"}{{ end }}'
      - output:
          source: audit

  - job_name: traefik-access
    static_configs:
      - targets: [localhost]
        labels:
          job: traefik
          host: homelab-hub
          __path__: /var/log/traefik/*.json

  - job_name: hub-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - target_label: 'host'
        replacement: 'homelab-hub'
