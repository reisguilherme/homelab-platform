# Drop-in for the existing Docker unit inside the dedicated playback guest.
# Never install this on the Proxmox host or on a shared Docker node.
[Unit]
RequiresMountsFor=/srv/media-view/media /srv/transcode
BindsTo=srv-media\x2dview-media.mount srv-transcode.mount
After=srv-media\x2dview-media.mount srv-transcode.mount
