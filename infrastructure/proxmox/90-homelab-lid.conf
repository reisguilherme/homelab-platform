# Install as /etc/systemd/logind.conf.d/90-homelab-lid.conf on the notebook host.
# Ignore logind lid actions on AC, battery or dock; other suspend causes remain possible.
# Apply/check/rollback: docs/runbooks/notebook-lid.md. No new host unit is needed.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
