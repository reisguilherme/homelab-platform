# Guest-only private TLS ingress. Firewall admits the management jump host.
# Install as /etc/nginx/sites-available/homelab-control; disable the default site.
# Keep query strings and headers out of the access log, including failed logins.
log_format homelab_control '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                          '$status $body_bytes_sent $request_time';
server {
    listen 8443 ssl;
    server_name localhost 127.0.0.1 homelab-control;
    ssl_certificate /etc/homelab-control/tls/server.crt;
    ssl_certificate_key /etc/homelab-control/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:HomelabTLS:1m;
    ssl_session_timeout 10m;
    server_tokens off;
    client_max_body_size 16k;
    access_log /var/log/nginx/homelab-control.access.log homelab_control;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 35s;
    }

    location /grafana/ {
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 35s;
    }
}
