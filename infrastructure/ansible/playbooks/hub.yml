---
- name: Configure VM 100 (homelab-hub)
  hosts: hub
  become: true

  tasks:
    - name: Install base packages and Docker prerequisites
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - jq
          - qemu-guest-agent
          - rsync
          - prometheus-node-exporter
          - unattended-upgrades
        state: present
        update_cache: true

    - name: Ensure /etc/systemd/resolved.conf.d exists
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        mode: "0755"

    - name: Disable systemd-resolved stub listener so CoreDNS can bind port 53
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/99-coredns.conf
        mode: "0644"
        content: |
          [Resolve]
          DNSStubListener=no
      notify: Restart systemd-resolved

    - name: Point /etc/resolv.conf to systemd-resolved upstream resolv.conf instead of stub 127.0.0.53
      ansible.builtin.file:
        src: /run/systemd/resolve/resolv.conf
        dest: /etc/resolv.conf
        state: link
        force: true

    - name: Install Docker Engine using official convenience repo
      ansible.builtin.shell: |
        set -euo pipefail
        if ! command -v docker >/dev/null 2>&1; then
          install -m 0755 -d /etc/apt/keyrings
          curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
          chmod a+r /etc/apt/keyrings/docker.asc
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" > /etc/apt/sources.list.d/docker.list
          apt-get update
          apt-get install -y docker-ce docker-ce-cli containerd.io docker-compose-plugin
        fi
      args:
        executable: /bin/bash
        creates: /usr/bin/docker

    - name: Install Tailscale client
      ansible.builtin.shell: |
        set -euo pipefail
        if ! command -v tailscale >/dev/null 2>&1; then
          curl -fsSL https://tailscale.com/install.sh | sh
        fi
      args:
        executable: /bin/bash
        creates: /usr/bin/tailscale

    - name: Collect Hub Compose metrics with systemd
      ansible.builtin.import_tasks: tasks/textfile.yml
      vars:
        metric_source: hub-compose

    - name: Ensure /opt/homelab-hub and persistent data directories exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: "0755"
      loop:
        - /opt/homelab-hub
        - /srv/hub/traefik/acme
        - /srv/hub/traefik/logs
        - /srv/hub/authelia
        - /srv/hub/prometheus
        - /srv/hub/grafana
        - /srv/hub/loki
        - /srv/hub/alertmanager

    - name: Set non-root ownership on Hub observability data directories
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.uid }}"
        group: "{{ item.gid }}"
        mode: "0755"
      loop:
        - { path: /srv/hub/prometheus, uid: "65534", gid: "65534" }
        - { path: /srv/hub/grafana, uid: "472", gid: "472" }
        - { path: /srv/hub/loki, uid: "10001", gid: "10001" }

    - name: Synchronize declarative Hub Compose stack
      ansible.posix.synchronize:
        src: ../../hub/
        dest: /opt/homelab-hub/
        rsync_opts:
          - "--exclude=.env"
          - "--exclude=/observability/prometheus/"

    - name: Stage the complete Prometheus configuration for validation
      ansible.posix.synchronize:
        src: ../../hub/observability/prometheus/
        dest: /opt/homelab-hub/observability/prometheus-candidate/
        delete: true

    - name: Sync declarative Authelia configuration
      ansible.builtin.copy:
        src: /opt/homelab-hub/authelia/configuration.yml.example
        dest: /opt/homelab-hub/authelia/configuration.yml
        remote_src: true
        force: true
        mode: "0644"
      register: authelia_cfg_copy

    - name: Initialize CoreDNS zone file from template when absent
      ansible.builtin.copy:
        src: /opt/homelab-hub/coredns/db.greis.dev.br.template
        dest: /opt/homelab-hub/coredns/db.greis.dev.br
        remote_src: true
        force: false
        mode: "0644"

    - name: Ensure Traefik acme.json exists with strict 0600 permissions
      ansible.builtin.file:
        path: /srv/hub/traefik/acme/acme.json
        state: touch
        mode: "0600"
        modification_time: preserve
        access_time: preserve

    - ansible.builtin.meta: flush_handlers

    - name: Check whether private /opt/homelab-hub/.env is provisioned
      ansible.builtin.stat:
        path: /opt/homelab-hub/.env
      register: hub_env

    - name: Check whether Authelia users_database.yml is provisioned
      ansible.builtin.stat:
        path: /srv/hub/authelia/users_database.yml
      register: authelia_users_db

    - name: Generate /srv/hub/authelia/users_database.yml for unified root user
      ansible.builtin.shell: |
        set -euo pipefail
        set -a
        . /opt/homelab-hub/.env
        set +a
        ROOT_USER="${ROOT_USERNAME:-root}"
        PASS="${ROOT_PASSWORD:?ROOT_PASSWORD must be defined in /opt/homelab-hub/.env}"
        HASH="$(docker run --rm authelia/authelia:4.38 authelia crypto hash generate argon2 --password "${PASS}" | sed -n 's/^Digest: //p')"
        test -n "${HASH}"
        umask 0177
        cat > /srv/hub/authelia/users_database.yml <<EOF
        users:
          ${ROOT_USER}:
            disabled: false
            displayname: "HomeServer Root"
            password: "${HASH}"
            email: root@greis.dev.br
            groups:
              - admins
        EOF
      args:
        executable: /bin/bash
      no_log: true
      when:
        - hub_env.stat.exists
        - not authelia_users_db.stat.exists

    - name: Validate and publish the Prometheus configuration and rules
      when: hub_env.stat.exists
      block:
        - name: Validate the staged files with the configured Prometheus image
          ansible.builtin.command:
            cmd: >-
              docker compose run --rm --no-deps --entrypoint /bin/promtool
              --volume /opt/homelab-hub/observability/prometheus-candidate:/etc/prometheus:ro
              prometheus check config /etc/prometheus/prometheus.yml
            chdir: /opt/homelab-hub
          changed_when: false

        - name: Publish validated files to the directory watched by Prometheus
          ansible.builtin.command:
            cmd: rsync -rc --delay-updates --delete-after --itemize-changes prometheus-candidate/ prometheus/
            chdir: /opt/homelab-hub/observability
          register: prometheus_sync
          changed_when: prometheus_sync.stdout | length > 0

    - name: Start Hub Docker Compose stack when .env is present
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: /opt/homelab-hub
      environment:
        TRAEFIK_CONFIG_SHA: "{{ lookup('ansible.builtin.file', '../../hub/traefik/traefik.yml', rstrip=false) | hash('sha256') }}"
      when: hub_env.stat.exists

    - name: Recreate hub-authelia when declarative configuration changes
      ansible.builtin.command:
        cmd: docker compose up -d --force-recreate authelia
        chdir: /opt/homelab-hub
      when:
        - hub_env.stat.exists
        - authelia_cfg_copy.changed

  handlers:
    - name: Restart systemd-resolved
      ansible.builtin.systemd:
        name: systemd-resolved
        state: restarted
