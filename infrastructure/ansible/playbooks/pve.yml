---
- name: Provision the cloud-init vendor data used by the Hub and K3s VMs
  hosts: pve
  become: true
  tags: [cloudinit]

  tasks:
    - name: Locate the vendor snippet on Proxmox local storage
      ansible.builtin.command: pvesm path local:snippets/homelab-vendor.yaml
      register: vendor_snippet
      changed_when: false
      check_mode: false

    - name: Ensure the Proxmox snippets directory exists
      ansible.builtin.file:
        path: "{{ vendor_snippet.stdout | trim | dirname }}"
        state: directory
        mode: '0755'

    - name: Install the shared VM cloud-init vendor data
      ansible.builtin.copy:
        src: homelab-vendor.yaml
        dest: "{{ vendor_snippet.stdout | trim }}"
        mode: '0644'

- name: Reserve the Intel iGPU on pve01 for VM 200
  hosts: pve
  become: true
  tags: [igpu]
  vars:
    reserve_intel_igpu: true

  tasks:
    - name: Check that the VFIO ID matches only the mapped Intel PCI function
      ansible.builtin.command: lspci -Dn -d 8086:9bc4
      register: intel_pci
      changed_when: false
      check_mode: false
      failed_when: >-
        intel_pci.rc != 0 or intel_pci.stdout_lines | length != 1 or
        not intel_pci.stdout.startswith('0000:00:02.0 ')
      when: reserve_intel_igpu | bool

    - name: Reserve the Intel PCI ID before i915 probes display devices
      ansible.builtin.blockinfile:
        path: /etc/modprobe.d/homelab-igpu.conf
        create: true
        mode: '0644'
        state: "{{ 'present' if reserve_intel_igpu | bool else 'absent' }}"
        block: |
          options vfio-pci ids=8086:9bc4
          softdep i915 pre: vfio-pci
      notify: Rebuild Proxmox initramfs

    - name: Load vfio-pci during early boot
      ansible.builtin.blockinfile:
        path: /etc/initramfs-tools/modules
        marker: "# {mark} ANSIBLE MANAGED Intel iGPU for VM 200"
        state: "{{ 'present' if reserve_intel_igpu | bool else 'absent' }}"
        block: vfio_pci
      notify: Rebuild Proxmox initramfs

  handlers:
    - name: Rebuild Proxmox initramfs
      ansible.builtin.command: update-initramfs -u -k all

- name: Configure Proxmox VE host vmbr1 NAT, conntrack zone isolation, and LAN TV DNAT
  hosts: pve
  become: true

  tasks:
    - name: Enable IPv4 forwarding persistently
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        state: present
        reload: true

    - name: Write clean declarative /etc/network/interfaces.d/homelab-vmbr1
      ansible.builtin.copy:
        dest: /etc/network/interfaces.d/homelab-vmbr1
        mode: "0644"
        content: |
          auto vmbr1
          iface vmbr1 inet static
              address 172.28.64.1/24
              bridge-ports none
              bridge-stp off
              bridge-fd 0
              post-up iptables -t raw -C PREROUTING -i fwbr+ -j CT --zone 1 2>/dev/null || iptables -t raw -I PREROUTING 1 -i fwbr+ -j CT --zone 1
              pre-down iptables -t raw -D PREROUTING -i fwbr+ -j CT --zone 1 2>/dev/null || true
              post-up iptables -t nat -C POSTROUTING -s 172.28.64.0/24 -o vmbr0 -m comment --comment homelab-vm-egress -j MASQUERADE 2>/dev/null || iptables -t nat -A POSTROUTING -s 172.28.64.0/24 -o vmbr0 -m comment --comment homelab-vm-egress -j MASQUERADE
              pre-down iptables -t nat -D POSTROUTING -s 172.28.64.0/24 -o vmbr0 -m comment --comment homelab-vm-egress -j MASQUERADE 2>/dev/null || true
              post-up iptables -t nat -C PREROUTING -s 192.168.1.0/24 -d 192.168.1.20/32 -i vmbr0 -p tcp -m tcp --dport 8096 -m comment --comment homelab-jellyfin-lan-8096 -j DNAT --to-destination 172.28.64.100:8096 2>/dev/null || iptables -t nat -A PREROUTING -s 192.168.1.0/24 -d 192.168.1.20/32 -i vmbr0 -p tcp -m tcp --dport 8096 -m comment --comment homelab-jellyfin-lan-8096 -j DNAT --to-destination 172.28.64.100:8096
              pre-down iptables -t nat -D PREROUTING -s 192.168.1.0/24 -d 192.168.1.20/32 -i vmbr0 -p tcp -m tcp --dport 8096 -m comment --comment homelab-jellyfin-lan-8096 -j DNAT --to-destination 172.28.64.100:8096 2>/dev/null || true

    - name: Apply live conntrack zone 1 isolation for all PVE firewall bridges (fwbr+) and clean legacy per-tap raw rules
      ansible.builtin.shell: |
        set -euo pipefail
        iptables -t raw -F PREROUTING
        iptables -t raw -I PREROUTING 1 -i fwbr+ -j CT --zone 1
        iptables -t nat -C POSTROUTING -s 172.28.64.0/24 -o vmbr0 -m comment --comment homelab-vm-egress -j MASQUERADE 2>/dev/null || \
          iptables -t nat -A POSTROUTING -s 172.28.64.0/24 -o vmbr0 -m comment --comment homelab-vm-egress -j MASQUERADE
        iptables -t nat -D PREROUTING -s 192.168.1.0/24 -d 192.168.1.20/32 -i vmbr0 -p tcp -m tcp --dport 8096 -m comment --comment homelab-jellyfin-lan-8096 -j DNAT --to-destination 172.28.64.40:8096 2>/dev/null || true
        iptables -t nat -C PREROUTING -s 192.168.1.0/24 -d 192.168.1.20/32 -i vmbr0 -p tcp -m tcp --dport 8096 -m comment --comment homelab-jellyfin-lan-8096 -j DNAT --to-destination 172.28.64.100:8096 2>/dev/null || \
          iptables -t nat -A PREROUTING -s 192.168.1.0/24 -d 192.168.1.20/32 -i vmbr0 -p tcp -m tcp --dport 8096 -m comment --comment homelab-jellyfin-lan-8096 -j DNAT --to-destination 172.28.64.100:8096
      args:
        executable: /bin/bash
