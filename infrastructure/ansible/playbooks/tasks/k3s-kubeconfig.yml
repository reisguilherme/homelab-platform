---
- name: Inspect the admin kubeconfig and its directory without opening the file
  ansible.builtin.stat:
    path: "{{ item }}"
    follow: false
    get_checksum: false
    get_mime: false
    get_attributes: false
  loop: [/etc/rancher/k3s, /etc/rancher/k3s/k3s.yaml]
  register: k3s_admin_paths

- name: Require the installed K3s directory and a regular admin kubeconfig
  ansible.builtin.assert:
    that:
      - k3s_admin_paths.results[0].stat.isdir | default(false)
      - k3s_admin_paths.results[1].stat.isreg | default(false)

- name: Restrict traversal of local K3s configuration to root
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Restrict the existing admin kubeconfig to root
  ansible.builtin.file:
    path: /etc/rancher/k3s/k3s.yaml
    state: file
    owner: root
    group: root
    mode: '0600'
  diff: false

- name: Locate the unit generated by the K3s installer
  ansible.builtin.command:
    argv: [systemctl, show, k3s.service, --property=FragmentPath, --value]
  register: k3s_fragment
  changed_when: false
  check_mode: false
  failed_when: k3s_fragment.rc != 0 or k3s_fragment.stdout | trim != '/etc/systemd/system/k3s.service'

- name: Persist the private mode in the installer-generated server arguments
  ansible.builtin.replace:
    path: /etc/systemd/system/k3s.service
    regexp: >-
      (?<!\S)(['"]?--write-kubeconfig-mode['"]?(?:=|[ \t]*(?:\\\r?\n)?[ \t]+)['"]?)0?[0-7]{3}(?=['"\s]|$)
    replace: '\g<1>0600'
  register: k3s_private_mode
  diff: false
  no_log: true

- name: Check whether the system manager has loaded the updated unit
  ansible.builtin.command:
    argv: [systemctl, show, k3s.service, --property=NeedDaemonReload, --value]
  register: k3s_reload_required
  changed_when: false
  check_mode: false

- name: Reload the unit definition while keeping the running K3s process
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: k3s_private_mode.changed or k3s_reload_required.stdout | trim == 'yes'

- name: Verify only the admin kubeconfig mode from the effective server arguments
  ansible.builtin.command:
    argv:
      - /usr/bin/python3
      - -c
      - |
        import re
        import subprocess
        import sys
        unit = subprocess.check_output(
            ["systemctl", "show", "k3s.service", "--property=ExecStart", "--value"], text=True
        )
        modes = re.findall(r"(?<!\S)--write-kubeconfig-mode(?:=|\s+)(\S+)", unit)
        if modes != ["0600"]:
            sys.exit("Effective k3s.service must specify a single admin kubeconfig mode of 0600")
  changed_when: false
  check_mode: false
  when: not ansible_check_mode or (not k3s_private_mode.changed and k3s_reload_required.stdout | trim == 'no')
