---
- name: Configure VM 200 (homelab-k3s) with direct storage, iGPU, K3s, SOPS and FluxCD
  hosts: k3s_nodes
  become: true

  tasks:
    - name: Install runtime, filesystem, and telemetry packages
      ansible.builtin.apt:
        name:
          - curl
          - ca-certificates
          - git
          - qemu-guest-agent
          - open-iscsi
          - prometheus-node-exporter
          - unattended-upgrades
        state: present
        update_cache: true

    - name: Install Intel media drivers and track extra modules with the Ubuntu generic kernel
      tags: [igpu]
      ansible.builtin.apt:
        name:
          - linux-image-generic
          - intel-media-va-driver-non-free
          - vainfo
        state: present
        cache_valid_time: 3600

    - name: Include the guest data mounts in node exporter filesystem metrics
      tags: [storage_metrics]
      ansible.builtin.lineinfile:
        path: /etc/default/prometheus-node-exporter
        regexp: '^ARGS='
        line: 'ARGS="--collector.filesystem.mount-points-exclude=^/(dev|proc|run|sys|media|var/lib/docker/.+|var/lib/containers/storage/.+|var/lib/kubelet/.+)($|/)"'
      notify: Restart node exporter

    - name: Identify the kernel selected for the next guest boot
      tags: [igpu]
      ansible.builtin.stat:
        path: /boot/vmlinuz
      register: guest_boot_kernel

    - name: Verify that the next guest kernel includes i915
      tags: [igpu]
      ansible.builtin.command:
        argv:
          - modinfo
          - -k
          - "{{ guest_boot_kernel.stat.lnk_source | basename | regex_replace('^vmlinuz-', '') }}"
          - i915
      changed_when: false

    - name: Ensure mount points exist
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0755"
      loop:
        - /mnt/storage
        - /mnt/transcode

    - name: Format dedicated transcode scratch disk if unformatted
      community.general.filesystem:
        fstype: ext4
        dev: "{{ transcode_disk_device }}"
        opts: "-L jf-transcode"
      when: transcode_disk_device is defined

    - name: Read transcode scratch disk UUID
      ansible.builtin.command:
        cmd: "blkid -s UUID -o value {{ transcode_disk_device }}"
      register: transcode_disk_uuid
      changed_when: false
      when: transcode_disk_device is defined

    - name: Mount 18 TB USB ext4 disk deterministically by UUID
      ansible.posix.mount:
        path: /mnt/storage
        src: "UUID={{ media_hdd_uuid }}"
        fstype: ext4
        opts: "defaults,noatime,nofail,x-systemd.device-timeout=30s"
        state: mounted

    - name: Mount dedicated transcode scratch disk deterministically by UUID
      ansible.posix.mount:
        path: /mnt/transcode
        src: "UUID={{ transcode_disk_uuid.stdout | trim }}"
        fstype: ext4
        opts: "defaults,noatime,nofail,x-systemd.device-timeout=15s"
        state: mounted
      when: transcode_disk_device is defined
      notify: Reload systemd

    - name: Prepare Jellyfin scratch directory with UID/GID 1000
      ansible.builtin.file:
        path: /mnt/transcode/jellyfin
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0755"

    - name: Configure Intel QuickSync /dev/dri udev permissions
      tags: [igpu]
      ansible.builtin.copy:
        dest: /etc/udev/rules.d/60-intel-dri.rules
        mode: "0644"
        content: |
          SUBSYSTEM=="drm", KERNEL=="renderD*", GROUP="render", MODE="0660"
          SUBSYSTEM=="drm", KERNEL=="card*", GROUP="video", MODE="0660"

    - name: Install systemd drop-in enforcing RequiresMountsFor before K3s starts
      ansible.builtin.file:
        path: /etc/systemd/system/k3s.service.d
        state: directory
        mode: "0755"

    - name: Write k3s mount dependency drop-in
      ansible.builtin.copy:
        dest: /etc/systemd/system/k3s.service.d/10-storage-mounts.conf
        mode: "0644"
        content: |
          [Unit]
          RequiresMountsFor=/mnt/storage /mnt/transcode
      notify: Reload systemd

    - ansible.builtin.meta: flush_handlers

    - name: Install K3s single-node server (keep Traefik enabled for internal Hub forwarding)
      ansible.builtin.shell: |
        set -euo pipefail
        if ! command -v k3s >/dev/null 2>&1; then
          curl -sfL https://get.k3s.io | INSTALL_K3S_VERSION="{{ k3s_version }}" sh -s - server \
            --write-kubeconfig-mode 0644 \
            --tls-san "{{ ansible_host }}"
        fi
      args:
        executable: /bin/bash
        creates: /usr/local/bin/k3s

    - name: Ensure K3s service is enabled and running
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started
        daemon_reload: true

    - name: Install pinned Flux CLI compatible with K3s version
      ansible.builtin.shell: |
        set -euo pipefail
        WANT="{{ flux_version | default('2.5.1') }}"
        if ! command -v flux >/dev/null 2>&1 || ! flux --version | grep -Fq "${WANT}"; then
          curl -fsSL https://fluxcd.io/install.sh | FLUX_VERSION="${WANT}" bash
        fi
      args:
        executable: /bin/bash

    - name: Create flux-system namespace
      ansible.builtin.shell: |
        set -euo pipefail
        k3s kubectl create namespace flux-system --dry-run=client -o yaml | k3s kubectl apply -f -
      args:
        executable: /bin/bash
      changed_when: false

    - name: Provision SOPS Age private decryption key secret in flux-system
      ansible.builtin.shell: |
        set -euo pipefail
        k3s kubectl create secret generic sops-age \
          --namespace=flux-system \
          --from-file=age.agekey=/dev/stdin \
          --dry-run=client -o yaml | k3s kubectl apply -f -
      args:
        executable: /bin/bash
        stdin: "{{ lookup('file', sops_age_key_file) }}"
      no_log: true

    - name: Bootstrap FluxCD GitOps from homelab-platform main branch (requires GITHUB_TOKEN in env)
      ansible.builtin.command:
        cmd: >
          flux bootstrap github
          --owner={{ flux_repo_owner }}
          --repository={{ flux_repo_name }}
          --branch={{ flux_repo_branch }}
          --path={{ flux_cluster_path }}
          --personal
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      when: lookup('env', 'GITHUB_TOKEN') | length > 0

    - name: Install Flux controllers without PAT for public GitOps repositories
      ansible.builtin.shell: |
        set -euo pipefail
        if ! k3s kubectl -n flux-system get deploy source-controller >/dev/null 2>&1; then
          flux check --pre
          flux install
        fi
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      when: lookup('env', 'GITHUB_TOKEN') | length == 0

    - name: Apply Flux cluster root kustomization when bootstrapping without PAT
      ansible.builtin.shell: |
        set -euo pipefail
        k3s kubectl wait --for=condition=Established \
          crd/gitrepositories.source.toolkit.fluxcd.io \
          crd/kustomizations.kustomize.toolkit.fluxcd.io \
          --timeout=60s
        k3s kubectl apply -k https://github.com/{{ flux_repo_owner }}/{{ flux_repo_name }}//{{ flux_cluster_path }}?ref={{ flux_repo_branch }}
      args:
        executable: /bin/bash
      environment:
        KUBECONFIG: /etc/rancher/k3s/k3s.yaml
      when: lookup('env', 'GITHUB_TOKEN') | length == 0

  handlers:
    - name: Restart node exporter
      ansible.builtin.systemd:
        name: prometheus-node-exporter
        state: restarted

    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
