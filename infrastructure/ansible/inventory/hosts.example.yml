all:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/proxmox-handoff-ed25519
    ansible_ssh_common_args: "-J root@192.168.1.20"
    k3s_version: "v1.31.4+k3s1"
    flux_repo_owner: "reisguilherme"
    flux_repo_name: "homelab-platform"
    flux_repo_branch: "main"
    flux_cluster_path: "kubernetes/clusters/homelab"
    sops_age_key_file: "~/.config/sops/age/keys.txt"

  children:
    pve:
      hosts:
        pve01:
          ansible_connection: local

    hub:
      hosts:
        homelab-hub:
          ansible_host: 172.28.64.100

    k3s_nodes:
      hosts:
        homelab-k3s:
          ansible_host: 172.28.64.200
          media_hdd_uuid: "REPLACE_WITH_18TB_EXT4_UUID"
          transcode_disk_device: "/dev/sdb"
