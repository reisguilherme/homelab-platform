- name: fresh recovered evidence clears availability and admission alerts
  interval: 30s
  input_series:
  - *id001
  - series: homeserver_playback_jellyfin_up{job="guests",role="playback",instance="playback.fixture:9100"}
    values: 0 0 0 1 1 1
  - series: homeserver_playback_storage_admitted{job="guests",role="playback",instance="playback.fixture:9100"}
    values: 0 0 0 1 1 1
  - *id003
  alert_rule_test:
  - eval_time: 1m
    alertname: PlaybackJellyfinUnavailable
    exp_alerts:
    - exp_labels: *id004
      exp_annotations: *id005
  - eval_time: 1m
    alertname: PlaybackStorageAdmissionRefused
    exp_alerts:
    - exp_labels: *id004
      exp_annotations: *id009
  - eval_time: 1m30s
    alertname: PlaybackJellyfinUnavailable
    exp_alerts: []
  - eval_time: 1m30s
    alertname: PlaybackStorageAdmissionRefused
    exp_alerts: []
  - eval_time: 1m30s
    alertname: PlaybackCollectorStale
    exp_alerts: []
  promql_expr_test:
  - expr: homeserver_playback_jellyfin_up{job="guests",role="playback"} and on(job,instance) (time() - homeserver_playback_observed_timestamp_seconds{job="guests",role="playback"}
      <= 60) and on(job,instance) (time() - homeserver_playback_observed_timestamp_seconds{job="guests",role="playback"}
      >= 0) and on(job,instance) (up{job="guests",role="playback"} == 1)
    eval_time: 1m30s
    exp_samples:
    - labels: homeserver_playback_jellyfin_up{instance="playback.fixture:9100",job="guests",role="playback"}
      value: 1
  - expr: homeserver_playback_storage_admitted{job="guests",role="playback"} and on(job,instance) (time() - homeserver_playback_observed_timestamp_seconds{job="guests",role="playback"}
      <= 60) and on(job,instance) (time() - homeserver_playback_observed_timestamp_seconds{job="guests",role="playback"}
      >= 0) and on(job,instance) (up{job="guests",role="playback"} == 1)
    eval_time: 1m30s
    exp_samples:
    - labels: homeserver_playback_storage_admitted{instance="playback.fixture:9100",job="guests",role="playback"}
      value: 1
  - expr: time() - homeserver_playback_observed_timestamp_seconds{job="guests",role="playback"}
    eval_time: 1m30s
    exp_samples:
    - labels: '{instance="playback.fixture:9100",job="guests",role="playback"}'
      value: 0
